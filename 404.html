<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 – Seite nicht gefunden</title>
  <meta name="theme-color" content="#121212" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #121212 url('/icons/lemonade-8163072_1280.jpg') no-repeat center/cover;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: rgba(0, 0, 0, 0.7);
      padding: 2rem;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.6s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    h1 {
      font-size: 5rem;
      margin: 0;
    }

    h2 {
      margin-top: 0.5rem;
      font-weight: normal;
    }

    p {
      color: #ddd;
      margin: 1.5rem 0;
    }

    .button {
      display: inline-block;
      background: #1e1e1e;
      color: #fff;
      text-decoration: none;
      padding: 0.9rem 1.5rem;
      border-radius: 10px;
      transition: background 0.3s;
    }

    .button:hover {
      background: #333;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>404</h1>
    <h2>Seite nicht gefunden</h2>

    <p>
      Die gewünschte Seite existiert nicht oder wurde verschoben.
    </p>

    <a class="button" href="index.html">Zur Startseite</a>

    <footer>© 2026 Cool Cooking</footer>
  </div>

</body>
</html>
